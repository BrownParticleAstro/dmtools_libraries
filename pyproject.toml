[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmtools_libraries"
version = "0.1.0"
description = "Utilities for DM plotting and mass conversion helpers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Andrew Gaitskell" }
]
dependencies = [
  "numpy",
  "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
